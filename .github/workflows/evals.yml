name: Evals

# Automatic runs are disabled for now: CI's pnpm 11 (from packageManager) no
# longer reads pnpm.patchedDependencies from package.json, so the frozen
# install fails against the lockfile written by pnpm 9. Re-enable pull_request
# and push triggers once the patch config and pnpm versions are aligned.
on:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  contract-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Deterministic policy contracts only. Behavior evals assert model
      # judgment and run from recorded model responses in their own job.
      - name: Run contract evals
        run: pnpm eval:report:contract
      - name: Publish eval check
        if: always()
        uses: getsentry/vitest-evals@v0
        with:
          results: eval-results/latest.json
          publish-check: true
          fail-on-failures: true
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coworker-eval-report
          path: eval-results/latest.json
